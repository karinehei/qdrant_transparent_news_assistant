name: Quick Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  quick-check:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Check disk space
      run: |
        df -h

    - name: Clean up space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        df -h

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt

    - name: Clean pip cache
      run: |
        pip cache purge || true
        df -h

    - name: Syntax check (main package)
      run: |
        python -m py_compile news_assistant/*.py news_assistant/ingestors/*.py

    - name: Import check (main package)
      run: |
        python -c "
        from news_assistant import settings
        from news_assistant import citations
        from news_assistant import safety
        from news_assistant import qdrant_store
        from news_assistant import retrieval
        from news_assistant.ingestors import base, rss
        print('✓ All main package imports successful')
        "

    - name: Import check (legacy modules)
      continue-on-error: true
      run: |
        python -c "
        try:
            import tools
            import config
            print('✓ Legacy modules import successful')
        except ImportError as e:
            print(f'⚠ Legacy modules not available: {e}')
        "
